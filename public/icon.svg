<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#262626" stroke-width="6"/>

  <!-- Subtle grid / dial circle -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="#262626" stroke-width="4" stroke-dasharray="4 6"/>
  <circle cx="256" cy="220" r="110" fill="#121212" stroke="#404040" stroke-width="4"/>

  <!-- Portafilter basket outline -->
  <path d="M 180 180 L 332 180 L 316 260 C 312 284, 290 300, 256 300 C 222 300, 200 284, 196 260 Z" 
        fill="url(#goldGrad)" 
        filter="url(#glow)"
        opacity="0.95"/>
  
  <!-- Portafilter Spout -->
  <path d="M 244 300 L 244 324 C 244 330, 249 335, 256 335 C 263 335, 268 330, 268 324 L 268 300 Z"
        fill="#f59e0b"/>

  <!-- Golden Espresso Stream / Drop -->
  <path d="M 256 348 C 248 362, 240 376, 240 388 C 240 402, 248 412, 256 412 C 264 412, 272 402, 272 388 C 272 376, 264 362, 256 348 Z" 
        fill="#fbbf24"
        filter="url(#glow)"/>

  <!-- Portafilter Ears / Lug tabs -->
  <rect x="156" y="186" width="24" height="14" rx="4" fill="#a3a3a3"/>
  <rect x="332" y="186" width="24" height="14" rx="4" fill="#a3a3a3"/>

  <!-- Handle connection and handle -->
  <path d="M 238 180 L 274 180 L 268 120 L 244 120 Z" fill="#525252"/>
  <rect x="240" y="70" width="32" height="60" rx="8" fill="#262626" stroke="#404040" stroke-width="3"/>

  <!-- Extraction waves / text indication -->
  <text x="256" y="468" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="4">BARISTA OS</text>
</svg>
